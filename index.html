<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6f6e69;--line:#e4e2dc;--accent:#5d6c10;--pf:#e4f09c;--pi:#2b3208;--danger:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#1f1f1d;--ink:#efeee9;--mute:#9a9892;--line:#33322e;--accent:#cfe07a;--pf:#cfe383;--pi:#1d2208;--danger:#ef6b5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#1f1f1d;--ink:#efeee9;--mute:#9a9892;--line:#33322e;--accent:#cfe07a;--pf:#cfe383;--pi:#1d2208;--danger:#ef6b5c;color-scheme:dark}
:root{--done:#2e8b57;--warn:#b9770e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--done:#4cbf84;--warn:#f0a63a}}
:root[data-theme="dark"]{--done:#4cbf84;--warn:#f0a63a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:285px 1fr;gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
nav.panel{padding:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
h2{font-size:18px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grow{flex:1 1 140px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.wk{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:12px 6px 4px}
.day{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:none;background:none;border-radius:8px;padding:7px 8px}
.day:hover{background:var(--bg)}
.day.on{background:var(--ink);color:var(--bg)}
.day .n{color:var(--mute);font-size:12px}
.day.on .n{color:inherit;opacity:.7}
.day.we{color:var(--mute);opacity:.5}
.day.we:hover{opacity:.8}
.day.we.on{opacity:1;background:var(--mute);color:var(--bg)}
.col{min-width:0}
.dv{height:1px;background:var(--line);margin:8px 4px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hrow h2{margin:0}
.dtag{display:inline-flex;align-items:center;gap:4px;width:fit-content;border:1px solid transparent;border-radius:999px;padding:2px 10px 2px 12px;font-size:12px;font-weight:600;cursor:pointer;background:var(--bg)}
.dtag.on{background:color-mix(in srgb,var(--done) 16%,transparent);color:var(--done)}
.dtag.off{background:var(--bg);color:var(--mute);border-color:var(--line)}
.hol{font-size:13px;color:var(--mute)}
.compose .clabel{text-transform:none;letter-spacing:0;font-size:13px}
span.dtag{cursor:default}
.compose{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.compose .row{justify-content:flex-end}
.clabel,.slabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;margin-bottom:8px}
.slabel{margin:0}
.compose textarea{width:100%;min-height:120px;resize:vertical;background:var(--card)}
#notes{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
#notes .empty{grid-column:1/-1}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.note .d{font-size:12px;color:var(--mute)}
.note .t{font-weight:600}
.note .b{white-space:pre-wrap;overflow-wrap:anywhere}
.note textarea{width:100%;min-height:90px;resize:vertical}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:13px}
.note.fin .cb,.note.fin .ups,.note.fin .addup,.note.fin .lw{opacity:.5}
.fb{margin:-14px -14px 6px;padding:7px 14px;background:color-mix(in srgb,var(--mute) 14%,var(--card));color:var(--mute);font-size:12px;font-weight:600;border-radius:13px 13px 0 0;border-bottom:1px solid var(--line)}
.hd{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.hd input[type=date]{margin-right:auto}
.bd{font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.bd.fin{color:var(--mute)}
.cb{display:flex;flex-direction:column;gap:6px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:12px;border-radius:6px;padding:1px 8px;border:none;background:var(--bg);color:var(--mute);background:color-mix(in srgb,var(--mute) 8%,var(--card));color:color-mix(in srgb,var(--ink) 58%,var(--card))}
.note input{width:100%}
.chk{padding:3px 10px;font-size:13px}
.ups{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
.up{display:flex;gap:8px;align-items:baseline;font-size:13px}
.ud{color:var(--mute);white-space:nowrap;font-size:12px;min-width:74px}
.up.cur .ud{color:var(--accent);font-weight:600}
.ut{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.up .x{padding:0 4px;font-size:12px}
.more{align-self:flex-start;border:none;background:none;color:var(--accent);padding:0;font-size:12px}
.addup{display:flex;gap:6px}
.note .addup textarea{flex:1;width:100%;min-height:0;font-size:13px;padding:5px 8px;resize:none;overflow:hidden;background:var(--card)}
.tfs{margin-top:8px;display:flex;flex-wrap:nowrap;gap:4px 10px;align-items:center}
.tf{position:relative;flex:0 1 auto;min-width:0;display:flex;align-items:center;min-height:30px}
.tl{width:62px;flex:none;color:var(--mute);font-size:13px}
.ta2{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:1;min-width:0}
.tf .tg{display:inline-flex;align-items:center}
.tadd{border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--mute) 45%,transparent);background:none;color:var(--mute);font-size:13px;padding:3px 10px;border-radius:8px}
.tadd:hover{border-color:var(--accent);color:var(--accent)}
.tadd,.foot .pri{height:30px;padding:0 12px;font-size:13px;line-height:1;display:inline-flex;align-items:center;box-sizing:border-box}
.foot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.foot .tfs{flex:1 1 auto;min-width:0;margin-top:0;flex-wrap:wrap}
.foot .pri{margin-left:auto}
.tx{border:none;background:none;padding:0 0 0 5px;font-size:12px;color:inherit;opacity:.6;cursor:pointer}
.tx:hover{opacity:1}
.tf input,.note .tf input{width:auto;min-width:110px;border:none;background:none;padding:2px 4px;font-size:13px}
.tf input:focus,.note .tf input:focus{outline:none}
.chk:hover{border-color:var(--done);color:var(--done)}
.mw{position:relative}
.kb{font-size:18px;line-height:1;padding:0 6px}
.mn{display:none;position:absolute;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.15);min-width:110px;overflow:hidden}
.mn.open{display:flex;flex-direction:column}
.mn button{border:none;border-radius:0;text-align:left;padding:8px 12px;background:none}
.mn button:hover{background:var(--bg)}
.mn .dl{color:var(--danger)}
.dt{border:none;background:none;padding:0;font-size:12px;color:var(--mute);cursor:pointer;text-align:left}
.dt:hover{color:var(--accent);text-decoration:underline dotted}
.hd input[type=date],.up input[type=date]{width:auto;font-size:12px;padding:2px 6px}
.x{border:none;background:none;color:var(--mute);padding:4px 8px}
.x:hover{color:var(--danger)}
.empty{color:var(--mute);padding:12px 0;font-size:14px}
#status{font-size:12px;color:var(--mute)}
@media (max-width:560px){
  .wrap{padding:14px 10px 32px}
  .grid{grid-template-columns:156px 1fr;gap:8px}
  nav.panel{padding:6px}
  .day{flex-direction:column;align-items:flex-start;gap:2px;padding:6px 6px 6px 20px;font-size:14px}
  .day .n{font-size:12px}
  .wk{margin:10px 4px 3px}
  .panel{padding:12px}
}
.pop{position:absolute;left:0;top:calc(100% + 4px);z-index:30;width:min(260px,80vw);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px}
.ph{font-size:12px;color:var(--mute);padding:2px 4px 6px}
.tf .pop input,.note .tf .pop input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px}
.tf .pop input:focus,.note .tf .pop input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.opts{margin-top:6px;max-height:220px;overflow:auto}
.opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.opt:hover{background:var(--bg)}
.ck{width:16px;height:16px;border:1.5px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:12px;flex:none;line-height:1}
.opt.on .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.day{position:relative;align-items:center;padding:7px 8px 7px 30px}
.day::after{content:"";position:absolute;left:0;top:0;bottom:0;width:30px;pointer-events:none;--tk:color-mix(in srgb,var(--mute) 24%,var(--card));background:linear-gradient(var(--tk),var(--tk)) left 0 top 0/var(--mw,14px) 1px no-repeat,linear-gradient(var(--tk),var(--tk)) left 0 top 33.3%/7px 1px no-repeat,linear-gradient(var(--tk),var(--tk)) left 0 top 66.6%/7px 1px no-repeat}
.day.mo{--mw:26px}
.day.all::after{display:none}
.day.all{padding-left:8px}
.tp{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.03em}
.mh{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:2px 0 6px}
.ch{display:grid;place-items:center;width:28px;height:28px;padding:0;border:none;background:none;border-radius:8px;color:var(--mute)}
.ch:hover{background:var(--bg);color:var(--ink)}
.ml{border:none;background:none;font-weight:600;font-size:14px;padding:4px 6px;border-radius:8px}
.ml:hover{background:var(--bg)}
@media (max-width:560px){.day{flex-direction:column;align-items:flex-start;gap:2px;padding:6px 6px 6px 20px}.day.all{padding-left:6px}.ml{font-size:13px}}
.dd{margin-left:auto;position:relative}
.dd .mn{min-width:190px}
.dd .mn button{display:flex;align-items:center;gap:8px;width:100%}
.ck2{width:14px;color:var(--accent);font-size:12px}
.dtag .car{display:inline-flex;margin:0;transition:transform .2s ease}
.dtag.open .car{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.dtag .car{transition:none}}
.nvh{position:sticky;top:0;z-index:3;background:var(--card);margin:-10px -10px 0;padding:10px 10px 4px}
.wkl{font-size:12px;color:var(--mute);opacity:.6;padding:10px 8px 2px 30px}
@media (max-width:560px){.nvh{margin:-6px -6px 0;padding:6px 6px 4px}.wkl{padding-left:20px}}
nav.panel{padding:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:hidden;display:flex;flex-direction:column}
.nvh{position:relative;z-index:2;flex:none;background:var(--card);margin:0;padding:10px 10px 6px;border-bottom:1px solid transparent;transition:box-shadow .15s,border-color .15s}
.nvh.stuck{border-bottom-color:var(--line);box-shadow:0 10px 24px -4px rgba(0,0,0,.055)}
#days{--tk:color-mix(in srgb,var(--mute) 24%,var(--card));position:relative;overflow:auto;flex:1;min-height:0;padding:0 10px 10px 22px;background:linear-gradient(to bottom,var(--tk) 0 1px,transparent 1px) 8px 0/7px 16px repeat-y,linear-gradient(to bottom,var(--tk) 0 1px,transparent 1px) 8px 0/4px 8px repeat-y;background-attachment:local,local}
.day{position:relative;align-items:center;height:32px;padding:0 8px 0 4px}
.day::after{content:"";position:absolute;left:-14px;top:0;bottom:auto;width:10px;height:1px;background:var(--tk);pointer-events:none}
.day.mo::after{width:16px}
.day.all{height:34px;padding:0 8px}
.day.all::after{display:none}
.day.we{color:color-mix(in srgb,var(--mute) 62%,var(--card));opacity:1}
.day.we:hover{opacity:1}
.wkl{height:32px;display:flex;align-items:flex-end;padding:0 8px 6px 4px;font-size:12px}
.hd{justify-content:space-between;align-items:flex-start}
.hd .cb{flex:1;min-width:0}
.hd .mw{flex:none;margin:-3px -6px 0 0}
.note .hd .b,.note .hd .t{font-weight:600}
@media (max-width:560px){
  .nvh{margin:0;padding:6px 6px 4px}
  #days{padding:0 6px 8px 18px;background-position:6px 0,6px 0}
  .day{font-size:13px;flex-direction:row;align-items:center;gap:4px;padding:0 4px 0 2px}
  .day::after{left:-12px}
  .tp{font-size:0;width:8px;height:8px;padding:0}
  .wkl{padding-left:2px}
}
.day{padding:0 8px 0 12px}
.wkl{padding-left:12px}
.tdb{position:absolute;left:50%;bottom:12px;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .15s,transform .15s;z-index:4}
.tdb.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
@media (max-width:560px){.day{padding:0 4px 0 8px}.wkl{padding-left:8px}}
.tdb{left:10px;right:10px;bottom:10px;width:auto;transform:translateY(8px);background:var(--accent);color:#fff;border-radius:10px;padding:9px 16px}
.tdb.show{transform:translateY(0)}
.up .dx{opacity:0;transition:opacity .12s;white-space:nowrap}
.up:hover .dx,.up .dx.arm,.up .dx:focus-visible{opacity:1}
.up .dx.arm{color:var(--danger);font-weight:600}
@media (hover:none){.up .dx{opacity:.55}}
html,body{height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{overflow:hidden}
.wrap{height:100%;padding:20px 16px 16px;display:flex;flex-direction:column}
header{flex:none}
.grid{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch}
nav.panel{position:relative;top:auto;max-height:none}
.col{overflow:auto;min-height:0;padding-right:2px}
@media (max-width:560px){.wrap{padding:12px 10px 10px}.tdb{left:6px;right:6px;bottom:6px}}
#notes{--wellbg:color-mix(in srgb,#000 5%,var(--bg));background:var(--wellbg);border-radius:16px;padding:10px}
#notes:empty{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #notes{--wellbg:color-mix(in srgb,#000 35%,var(--bg))}}
:root[data-theme="dark"] #notes{--wellbg:color-mix(in srgb,#000 35%,var(--bg))}
.ut a{color:color-mix(in srgb,var(--mute) 78%,var(--card));text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.ut a:hover{color:color-mix(in srgb,var(--ink) 78%,var(--card))}
.up .dx{font-size:17px;line-height:1;padding:0 4px;color:color-mix(in srgb,var(--mute) 70%,var(--card))}
.up .dx:hover{color:color-mix(in srgb,var(--ink) 72%,var(--card))}
.up .dx.arm{font-size:12px;color:var(--danger);font-weight:600}
.day{gap:6px}
.day>span:first-child{flex:1;min-width:0}
.rp{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;font-size:12px;font-weight:600;line-height:1;padding:3px 8px;border-radius:999px;color:color-mix(in srgb,var(--mute) 85%,var(--card));background:color-mix(in srgb,var(--mute) 14%,var(--card))}
.day.on .rp{background:color-mix(in srgb,var(--bg) 22%,transparent);color:inherit}
@media (max-width:560px){.rp{display:none}}
#notes{background:none;border-radius:0;padding:0}
.ut a,.ut a:hover{text-decoration:none}
.note .up textarea.ue{flex:1;min-width:0;width:100%;min-height:0;font-size:13px;line-height:1.45;padding:4px 8px;resize:none;overflow:hidden;background:var(--card)}
.ut .tg{display:inline-block;padding:0 6px;margin:0 1px;line-height:1.5;font-size:12px}
.note .hd .b,.note .hd .t{font-weight:500;color:color-mix(in srgb,var(--ink) 85%,var(--card))}
.allw{background:var(--bg);border-radius:10px;padding:3px}
.allw .day.all{font-weight:600}
.dtag.on{background:color-mix(in srgb,var(--ink) 11%,var(--card));color:color-mix(in srgb,var(--ink) 82%,var(--card))}
.mpop{position:absolute;left:10px;right:10px;top:calc(100% - 2px);z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.14);padding:8px}
.mph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.myr{font-weight:600;font-size:14px}
.mgr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mb{border:none;background:none;border-radius:8px;padding:8px 0;font-size:13px;text-align:center}
.mb:hover{background:var(--bg)}
.mb.cur{color:var(--accent);font-weight:600}
.mb.on{background:var(--ink);color:var(--bg)}
.mtd{display:block;width:100%;margin-top:6px;border:none;border-top:1px solid var(--line);border-radius:0;background:none;color:var(--mute);font-size:12px;padding:8px 0 2px}
.mtd:hover{color:var(--ink)}
header{align-items:center}
.hact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hact button{font-size:13px;padding:5px 12px;display:inline-flex;align-items:center;gap:6px}
.lw{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta>span{display:inline-flex;align-items:center;min-height:28px}
.cr{font-size:12px;font-weight:400;color:color-mix(in srgb,var(--mute) 65%,var(--card))}
.uh{display:flex;align-items:center;gap:5px;align-self:stretch;width:100%;border:none;background:none;padding:0 0 2px;font-size:12px;font-weight:600;color:var(--mute)}
.uh:hover{color:var(--ink)}
.uh svg{order:3;margin-left:auto;transition:transform .15s}
.uh.col svg{transform:rotate(-90deg)}
.ucnt{font-size:12px;font-weight:400;color:color-mix(in srgb,var(--mute) 65%,var(--card))}
/* spacing scale: 4 / 8 / 12 / 16 */
.note{padding:16px;gap:12px}
#notes{gap:12px}
.compose{padding:16px}
.foot{margin-top:12px}
.fb{margin:-16px -16px 0;padding:8px 16px}
.hd{gap:12px}
.cb{gap:8px}
.hd .mw{margin:-4px -8px 0 0}
.kb{display:grid;place-items:center;width:28px;height:28px;padding:0;border-radius:8px;line-height:1}
.kb:hover{background:var(--bg)}
.tags{gap:6px}
.tg{padding:2px 8px;line-height:1.4}
.ups{gap:8px;padding-top:12px}
.up{gap:12px;line-height:1.45}
.ud{flex:none;min-width:0;width:76px}
.uh{padding:0}

.meta{padding-top:4px}
.meta>span{min-height:32px}
.lw{gap:12px}
@media (max-width:560px){.note{padding:14px}.fb{margin:-14px -14px 0;padding:8px 14px}}
.wkl{justify-content:space-between;opacity:1;color:color-mix(in srgb,var(--mute) 70%,var(--card))}
.wks{display:inline-flex;align-items:center;gap:4px;border:none;background:none;padding:0 4px;font-size:12px;color:inherit;border-radius:6px;opacity:0;transition:opacity .12s}

function tagField(label,cls,init,key){
  var vals=init.slice(),box=el("div","tf"),area=el("div","ta2"),pop=null,off=null,refresh=null;

function relUp(u){
  var c=u.created,n=Date.now();

  o.updates=(Array.isArray(n.updates)?n.updates:[]).filter(function(u){return u&&typeof u.id==="string"&&typeof u.text==="string"&&okDate(u.date)}).map(function(u){var r={id:u.id.slice(0,80),text:u.text.slice(0,2000),date:u.date,created:typeof u.created==="number"?u.created:Date.now()};var fs=(Array.isArray(u.files)?u.files:[]).filter(function(f){return f&&typeof f.id==="string"&&/^[0-9a-f]{32}$/.test(f.id)&&typeof f.name==="string"&&typeof f.type==="string"}).slice(0,20).map(function(f){return{id:f.id,name:f.name.slice(0,200),type:f.type.slice(0,60),size:typeof f.size==="number"?f.size:0}});if(fs.length)r.files=fs;return r});
  return o;
}
async function exportData(){
  var payload={app:"work-notes",version:1,exportedAt:new Date().toISOString(),notes:notes,days:days};
  var text=JSON.stringify(payload,null,2),name="work-notes-"+todayK+".json",dl=null;
  try{if(window.claude&&claude.use)dl=await claude.use("downloads")}catch(e){dl=null}
  if(dl){
    try{var r=await dl.save({filename:name,data:text});status(r&&r.status==="saved"?"Exported "+notes.length+" tasks":"Export sent")}
    catch(e){if(!e||e.code!=="declined")status("Couldn’t export")}
    return;
  }
  try{
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
    status("Exported "+notes.length+" tasks");
  }catch(e){status("Export isn’t available in this view")}
}
function importData(file){
  var fr=new FileReader();
  fr.onerror=function(){status("Couldn’t read that file")};
  fr.onload=function(){
    var d;try{d=JSON.parse(fr.result)}catch(e){status("That isn’t a valid export file");return}
    if(!d||!Array.isArray(d.notes)){status("That isn’t a Work Notes export");return}
    var added=0,updated=0;
    d.notes.forEach(function(raw){
      var n=cleanNote(raw);if(!n)return;
      var i=notes.findIndex(function(x){return x.id===n.id});
      if(i<0){notes.push(n);added++}else{notes[i]=n;updated++}
      if(db){var b=Object.assign({},n);delete b.id;db.collection("notes").doc(n.id).set(b).catch(function(){status("Couldn’t save — read-only view")})}
    });
    var dayCount=0;
    if(d.days&&typeof d.days==="object"&&!Array.isArray(d.days)){
      Object.keys(d.days).forEach(function(k){
        var v=d.days[k];if(!okDate(k)||!(v==="working"||DT[v]))return;
        days[k]=v;dayCount++;
        if(db)db.collection("days").doc(k).set({status:v}).catch(function(){});
      });
    }
    notes.sort(function(x,y){return(y.created||0)-(x.created||0)});
    if(!db){lsSet("wt-notes",notes);lsSet("wt-days",days)}
    render();
    status("Imported "+added+" new"+(updated?", "+updated+" updated":"")+(dayCount?" · "+dayCount+" day settings":""));
  };
  fr.readAsText(file);
}
$("b-exp").onclick=exportData;
$("b-imp").onclick=function(){$("f-imp").click()};
$("f-imp").onchange=function(){var f=this.files&&this.files[0];if(f)importData(f);this.value=""};

/* ---- Data menu + manage ---- */
function closeDM(){var m=$("dm");if(m){m.classList.remove("open");$("b-data").setAttribute("aria-expanded","false");$("b-data").classList.remove("open")}}
$("b-data").onclick=function(e){e.stopPropagation();var m=$("dm"),o=!m.classList.contains("open");closeDM();if(o){m.classList.add("open");this.classList.add("open");this.setAttribute("aria-expanded","true")}};
document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest(".dw"))closeDM()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeDM();closeManage()}});
var origExp=exportData;
$("b-exp").onclick=function(){closeDM();origExp()};
$("b-imp").onclick=function(){closeDM();$("f-imp").click()};
$("b-man").onclick=function(){closeDM();openManage()};
function closeManage(){var m=document.getElementById("mgr");if(m)m.remove()}
function tagCounts(k){var o={};notes.forEach(function(n){(n[k]||[]).forEach(function(t){o[t]=(o[t]||0)+1})});return Object.keys(o).sort(function(a,b){return o[b]-o[a]||a.localeCompare(b)}).map(function(t){return{name:t,n:o[t]}})}
function retag(k,old,nw){
  notes.filter(function(n){return(n[k]||[]).indexOf(old)>=0}).forEach(function(n){
    var arr=[];(n[k]||[]).forEach(function(t){var v=t===old?nw:t;if(v&&arr.indexOf(v)<0)arr.push(v)});
    var o=Object.assign({},n);o[k]=arr;save(o);
  });
}
function wipeAll(){
  notes.slice().forEach(function(n){remove(n.id)});
  Object.keys(days).forEach(function(k){delete days[k];if(db)db.collection("days").doc(k).delete().catch(function(){})});
  if(!db){lsSet("wt-notes",notes);lsSet("wt-days",days)}
  render();
}
function openManage(){
  closeManage();
  var back=el("div","mgb");back.id="mgr";
  var box=el("div","mgd");box.setAttribute("role","dialog");box.setAttribute("aria-label","Manage data");
  back.appendChild(box);back.onclick=function(e){if(e.target===back)closeManage()};
  document.body.appendChild(back);
  var armed=false;
  function section(t,sub){var h=el("div","mgh");h.appendChild(el("div","mgt",t));if(sub)h.appendChild(el("div","mgs",sub));return h}
  function tagSection(title,k,sym){
    var wrap=el("div","mgsec"),list=tagCounts(k);
    wrap.appendChild(section(title,list.length?list.length+(list.length===1?" tag":" tags"):""));
    if(!list.length){wrap.appendChild(el("div","mge","None yet"));return wrap}
    list.forEach(function(t){
      var row=el("div","mgr"),nm=el("div","mgn");nm.appendChild(pill(sym+t.name,t.name));
      var ct=el("span","mgc",t.n+(t.n===1?" task":" tasks"));
      var rn=el("button","mgb2","Rename"),rm=el("button","mgb2 dg","Remove");
      rn.onclick=function(){
        row.textContent="";var inp=el("input");inp.value=t.name;inp.setAttribute("aria-label","New name");
        var ok=el("button","mgb2 ok","Save"),cn=el("button","mgb2","Cancel");
        function go(){var v=inp.value.trim().replace(/^[#@]/,"");if(!v||v===t.name){draw();return}retag(k,t.name,v);draw()}
        ok.onclick=go;cn.onclick=draw;inp.onkeydown=function(e){if(e.key==="Enter")go();if(e.key==="Escape"){e.stopPropagation();draw()}};
        row.className="mgr ed";row.append(inp,ok,cn);inp.focus();inp.select();
      };
      var r2=false;
      rm.onclick=function(){if(!r2){r2=true;rm.textContent="Remove from "+t.n+"?";rm.classList.add("arm");setTimeout(function(){if(r2&&rm.isConnected){r2=false;rm.textContent="Remove";rm.classList.remove("arm")}},3500);return}retag(k,t.name,"");draw()};
      var ac=el("div","mga");ac.append(rn,rm);row.append(nm,ct,ac);wrap.appendChild(row);
    });
    return wrap;
  }
  function draw(){
    box.textContent="";
    var hd=el("div","mgtop"),h=el("div","mgtt","Manage data"),x=el("button","mgx","✕");x.setAttribute("aria-label","Close");x.onclick=closeManage;hd.append(h,x);box.appendChild(hd);
    var body=el("div","mgbody");
    var done=notes.filter(function(n){return n.done}).length,ups=notes.reduce(function(a,n){return a+(n.updates||[]).length},0),dl=notes.filter(function(n){return n.deadline}).length;
    var st=el("div","mgstats");
    [["Tasks",notes.length],["Completed",done],["Updates",ups],["Deadlines",dl],["Days marked",Object.keys(days).length]].forEach(function(a){var c=el("div","mgst");c.append(el("div","mgv",String(a[1])),el("div","mgl",a[0]));st.appendChild(c)});
    body.appendChild(st);
    body.appendChild(el("div","mgnote",db?"Stored in your shared artifact database.":"Stored in this browser only."));
    body.appendChild(tagSection("Projects","projects","#"));
    body.appendChild(tagSection("People","people","@"));
    var dz=el("div","mgsec mgdz");dz.appendChild(section("Danger zone","Export first if you might want it back."));
    var wb=el("button","mgb2 dg wide","Delete all data");
    wb.disabled=!notes.length&&!Object.keys(days).length;
    wb.onclick=function(){if(!armed){armed=true;wb.textContent="Click again to delete everything";wb.classList.add("arm");setTimeout(function(){if(armed&&wb.isConnected){armed=false;wb.textContent="Delete all data";wb.classList.remove("arm")}},3500);return}wipeAll();armed=false;draw()};
    dz.appendChild(wb);body.appendChild(dz);
    box.appendChild(body);
  }
  draw();
}
init();
})();
</script>
